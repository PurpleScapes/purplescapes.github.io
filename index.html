/* Layout: a white gallery that uses the full screen. An intro with a wide image, then each collection as a wall of six canvases with a paint-drop progress meter, one purple band, and a lilac "say hello" moment. */
:root {
  --paper: #FFFFFF;   /* page ground */
  --ink: #020202;     /* text */
  --purple: #8846EA;  /* brand purple */
  --wash: #F6F1FD;    /* purple tint for empty canvases and the contact band */
  --line: #E8DCF6;    /* purple-biased hairlines */
  --muted: #5B5068;   /* secondary text */
  --soft: #FFF8F8;    /* brand off-white, used on purple and black */
  --display: "Clash Display", "Outfit", "Helvetica Neue", system-ui, sans-serif;
  --script: "Overtime", "Sacramento", "Snell Roundhand", cursive;
  --body: "Outfit", "Helvetica Neue", system-ui, sans-serif;
  --gutter: clamp(20px, 5vw, 80px);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-weight: 300; font-size: 1.05rem; line-height: 1.7; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }
.wrap { width: 100%; max-width: 1520px; margin-inline: auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }

/* type scale: 0.75 / 1.05 / 1.3 / 2.4 / 3.4 / 4.8 rem */
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h1 { font-size: clamp(2.6rem, 5.6vw, 4.8rem); line-height: 1.06; }
h2 { font-size: clamp(2rem, 3.8vw, 3.4rem); line-height: 1.1; }
h3 { font-size: 1.3rem; line-height: 1.3; }
p { margin: 0; }
.eyebrow { font-family: var(--body); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--purple); }
.lede { font-size: clamp(1.1rem, 1.5vw, 1.3rem); color: var(--muted); line-height: 1.65; }
.script { font-family: var(--script); font-weight: 500; color: var(--purple); letter-spacing: 0.01em; }
h1 .script, h2 .script { display: block; font-size: 1.08em; line-height: 1.5; margin-top: 0.12em; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; fill: currentColor; flex: 0 0 auto; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 22px; }
.top .logo { width: 112px; }
.top nav ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: clamp(16px, 3vw, 40px); margin: 0; padding: 0; }
.top nav a { text-decoration: none; font-size: 0.95rem; font-weight: 400; color: var(--muted); }
.top nav a:hover { color: var(--ink); }
.top nav a.ig { color: var(--ink); border-bottom: 1.5px solid var(--purple); padding-bottom: 2px; }

/* buttons */
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px; border-radius: 999px; font-family: var(--body); font-weight: 500; font-size: 1rem; line-height: 1.2; text-decoration: none; border: 1.5px solid transparent; cursor: pointer; transition: transform .2s, background .2s, color .2s; }
.btn.primary { background: var(--purple); color: var(--soft); }
.btn.primary:hover { transform: translateY(-2px); }
.btn.ghost { border-color: var(--ink); color: var(--ink); background: transparent; }
.btn.ghost:hover { background: var(--ink); color: var(--soft); }

/* intro */
.intro .wrap { display: grid; gap: clamp(36px, 5vw, 64px); padding-block: clamp(24px, 4vw, 56px) clamp(72px, 9vw, 128px); }
.intro-copy { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 28px clamp(32px, 6vw, 96px); align-items: end; }
.intro-copy .head { display: grid; gap: 20px; min-width: 0; }
.intro-copy .side { display: grid; gap: 28px; min-width: 0; padding-bottom: 0.4em; }
.intro-figure { margin: 0; min-width: 0; }
.intro-figure img { display: block; width: 100%; height: auto; max-height: 78vh; object-fit: cover; }
.ph { display: grid; place-items: center; align-content: center; gap: 14px; background: var(--wash); color: var(--purple); text-align: center; padding: 32px; font-size: 0.95rem; }
.ph .ico { width: 34px; height: 34px; }
.intro-figure .ph { aspect-ratio: 21 / 9; }
.img-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

/* collections */
.band { padding-block: clamp(72px, 9vw, 128px); }
.collections { display: grid; gap: clamp(88px, 11vw, 150px); }
.collection { display: grid; gap: clamp(28px, 4vw, 48px); scroll-margin-top: 24px; }
.col-head { display: flex; justify-content: space-between; align-items: end; gap: 24px 48px; flex-wrap: wrap; }
.col-title { display: grid; gap: 14px; min-width: 0; max-width: 760px; }
.col-desc { color: var(--muted); max-width: 60ch; }
.drops { display: grid; gap: 8px; justify-items: end; }
.drops .row { display: flex; gap: 8px; color: var(--purple); }
.drops .row svg { width: 16px; height: 20px; }
.drops .lbl { font-size: 0.85rem; color: var(--muted); }
.wall { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 2.4vw, 36px); }
.slot { display: grid; gap: 14px; align-content: start; text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
button.slot { cursor: pointer; }
.slot-art { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 5; overflow: hidden; background: var(--wash); }
.slot-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
button.slot:hover .slot-art img { transform: scale(1.03); }
.slot.empty .slot-art { background: transparent; border: 1.5px dashed var(--line); }
.slot-art .num { font-family: var(--display); font-weight: 500; font-size: 2.4rem; color: var(--line); }
.slot.st-wip .slot-art { background: radial-gradient(110% 80% at 30% 25%, rgba(136,70,234,.2), transparent 65%), var(--wash); border: 0; }
.slot.st-wip .slot-art .num { color: var(--purple); opacity: .5; }
.slot-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.slot-title { font-family: var(--display); font-weight: 500; font-size: 1.05rem; overflow-wrap: anywhere; }
.chip { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; white-space: nowrap; color: var(--muted); }
.chip.c-available, .chip.c-finished { color: var(--purple); }
.chip.c-sold { color: var(--ink); }
.slot-edit { font-size: 0.85rem; color: var(--purple); font-weight: 500; }

/* purple band */
.purple-band { background: var(--purple); color: var(--soft); }
.purple-band .wrap { padding-block: clamp(80px, 10vw, 140px); display: grid; gap: clamp(44px, 6vw, 72px); }
.purple-band .eyebrow { color: var(--soft); opacity: .85; }
.purple-band .head { display: grid; gap: 16px; max-width: 900px; }
.purple-band h2 .script { color: var(--soft); }
.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(28px, 4vw, 64px); }
.principle { display: grid; gap: 14px; align-content: start; min-width: 0; }
.principle .ico { width: 22px; height: 22px; }
.principle p { opacity: .9; }

/* how to buy */
.section-head { display: grid; gap: 16px; margin-bottom: clamp(36px, 5vw, 56px); max-width: 760px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(28px, 4vw, 64px); counter-reset: step; }
.steps li { counter-increment: step; display: grid; gap: 12px; align-content: start; min-width: 0; }
.steps li::before { content: counter(step, decimal-leading-zero); font-family: var(--display); font-weight: 500; font-size: 2.4rem; color: var(--purple); line-height: 1; }
.steps p { color: var(--muted); }
.cert-note { display: flex; gap: 14px; align-items: baseline; margin-top: clamp(40px, 5vw, 64px); max-width: 72ch; color: var(--muted); }
.cert-note .ico { color: var(--purple); }
.cert-note strong { color: var(--ink); font-weight: 500; }

/* say hello */
.say { background: var(--wash); overflow: hidden; }
.say .wrap { padding-block: clamp(80px, 10vw, 140px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px clamp(32px, 6vw, 96px); align-items: center; }
.say-left { display: grid; gap: 8px; min-width: 0; }
.say-script { font-family: var(--script); font-weight: 500; color: var(--purple); font-size: clamp(2.6rem, 5vw, 4.2rem); line-height: 1.5; transform: rotate(-4deg); transform-origin: left center; }
.say-right { display: grid; gap: 28px; justify-items: start; min-width: 0; }
.say-right p { color: var(--muted); max-width: 46ch; }
.handle { display: inline-flex; align-items: center; gap: 16px; font-family: var(--display); font-weight: 500; font-size: clamp(1.9rem, 3.6vw, 3rem); line-height: 1.2; color: var(--ink); text-decoration: none; background-image: linear-gradient(var(--purple), var(--purple)); background-size: 100% 3px; background-position: 0 100%; background-repeat: no-repeat; padding-bottom: 6px; transition: color .25s, background-size .25s; overflow-wrap: anywhere; }
.handle:hover { color: var(--purple); background-size: 40% 3px; }
.handle .ico { width: 0.7em; height: 0.7em; color: var(--purple); }

/* about */

      parts.push(lh, data);
      var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, name.length, true); cv.setUint32(38, 0, true); cv.setUint32(42, offset, true); ch.set(name, 46);
      central.push(ch); offset += lh.length + data.length;
    });
    var size = central.reduce(function (a, c) { return a + c.length; }, 0);
    var end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true); ev.setUint32(12, size, true); ev.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
  }
  function coverJPEG() {
    var s = coverImage(); if (!s) return Promise.resolve(null);
    return decode(s).then(function (im) { return dataURLBytes(draw(im, 1200).toDataURL('image/jpeg', 0.85)); }).catch(function () { return null; });
  }
  function ghCfg() { var c = cfg(), owner = String(c.owner || '').trim().replace(/^@/, ''); return { owner: owner, repo: String(c.repo || '').trim() || (owner ? owner + '.github.io' : ''), token: String(c.token || '').trim() }; }
  function ghHost() { var g = ghCfg(); if (!g.owner) return ''; var o = g.owner.toLowerCase(); return g.repo.toLowerCase() === o + '.github.io' ? o + '.github.io' : o + '.github.io/' + g.repo; }
  function b64(bytes) { var s = '', CH = 0x8000; for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); return btoa(s); }
  function ghFail(r, g) {
    if (r.status === 401) throw { msg: 'GitHub did not accept the access token. Please check it in Settings, or create a new one.' };
    if (r.status === 403) throw { msg: 'The token is not allowed to change files. Give it Contents: Read and write access to ' + g.repo + '.' };
    if (r.status === 404) throw { msg: 'GitHub could not find ' + g.owner + '/' + g.repo + '. Check the username and repository name in Settings, and that the token can access it.' };
    throw { msg: 'GitHub returned an error (' + r.status + '). Please try again in a minute.' };
  }
  function ghPut(g, path, bytes, message) {
    var url = 'https://api.github.com/repos/' + encodeURIComponent(g.owner) + '/' + encodeURIComponent(g.repo) + '/contents/' + path;
    var h = { 'Authorization': 'Bearer ' + g.token, 'Accept': 'application/vnd.github+json' };
    return fetch(url, { headers: h, cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) ghFail(r, g);
      return r.json();
    }).then(function (existing) {
      var body = { message: message, content: b64(bytes) };
      if (existing && existing.sha) body.sha = existing.sha;
      return fetch(url, { method: 'PUT', headers: { 'Authorization': h.Authorization, 'Accept': h.Accept, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }).then(function (r) { if (!r.ok) ghFail(r, g); return r.json(); });
  }
  function publish() {
    if (busy) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var g = ghCfg();
    if (!g.owner || !g.token) { helpSheet(); say('Set up your free GitHub website once, then Publish works with one click.'); return; }
    var host = ghHost(), pub = document.getElementById('eb-pub');
    busy = true; pub.disabled = true; say('Publishing\u2026');
    coverJPEG().then(function (cover) {
      if (!cover) return false;
      return ghPut(g, 'cover.jpg', cover, 'Update cover image').then(function () { return true; }, function () { return false; });
    }).then(function (hasCover) {
      return ghPut(g, 'index.html', utf8(publicDoc(hasCover ? host : '')), 'Update landing page');
    }).then(function () {
      busy = false; pub.disabled = false;
      say('Published. https://' + host + ' updates within a minute or two.' + (dirty ? ' Press Save to keep these edits in your file too.' : ''));
    }).catch(function (e) {
      busy = false; pub.disabled = false;
      say((e && e.msg) || 'Publishing did not reach GitHub. Check your internet connection, or use Help to upload the website file by hand.');
    });
  }

  /* ---------- drafts ---------- */
  function changed() { dirty = true; say('Unsaved changes'); clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 800); }
  function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: savedJSON.length, state: state })); } catch (e) {} }
  function readDraft() { try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return d && d.state ? d : null; } catch (e) { return null; } }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  /* ---------- events ---------- */
  root.addEventListener('input', function (e) {
    var t = e.target, el = t.closest && t.closest('[data-edit]');
    if (el && el.isContentEditable) { setPath(state, el.getAttribute('data-edit'), el.innerText.replace(/\n+$/, '')); changed(); return; }
    if (t.hasAttribute && t.hasAttribute('data-field') && sheetCtx && sheetCtx.kind === 'painting') { state.collections[sheetCtx.c].paintings[sheetCtx.p][t.getAttribute('data-field')] = t.value; changed(); return; }
    if (t.hasAttribute && t.hasAttribute('data-setting')) { state[t.getAttribute('data-setting')] = t.value.replace(/^@/, '').trim(); changed(); return; }
    if (t.hasAttribute && t.hasAttribute('data-cfg')) { var c = cfg(); c[t.getAttribute('data-cfg')] = t.value.trim(); setCfg(c); }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches && t.matches('input[data-upload]')) { var f = t.files && t.files[0], k = t.getAttribute('data-upload'); t.value = ''; if (f) handleImage(f, k); return; }
    if (t.matches && t.matches('input[data-upload-font]')) { var ff = t.files && t.files[0], w = t.getAttribute('data-upload-font'); t.value = ''; if (ff) handleFont(ff, w); return; }
    if (t.id === 'f-status' && sheetCtx) { state.collections[sheetCtx.c].paintings[sheetCtx.p].status = t.value; changed(); }
  });
  root.addEventListener('keydown', function (e) { var el = e.target.closest && e.target.closest('[data-single]'); if (el && el.isContentEditable && e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  root.addEventListener('paste', function (e) {
    var el = e.target.closest && e.target.closest('[data-edit]'); if (!el || !el.isContentEditable) return;
    e.preventDefault(); var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (el.hasAttribute('data-single')) text = text.replace(/\s*\n\s*/g, ' ');
    if (!document.execCommand('insertText', false, text)) el.textContent += text;
  });
  root.addEventListener('focusout', function (e) {
    var el = e.target.closest && e.target.closest('#collection-list [data-edit]'); if (!el) return;
    var i = +el.getAttribute('data-edit').split('.')[1], c = state.collections[i], a = el.closest('article');
    if (c && a) a.querySelectorAll('.slot-title').forEach(function (s, j) { s.textContent = pTitle(c, j); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet();
    if (isEditor && (e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(); }
  });
  document.getElementById('sheet').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  window.addEventListener('beforeunload', function (e) { if (isEditor && dirty) { e.preventDefault(); e.returnValue = ''; } });

  var delArmed = -1, delTimer = 0;
  root.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'close') return closeSheet();
    if (act === 'open') { var i = +b.getAttribute('data-c'), j = +b.getAttribute('data-p'); return editing ? editPainting(i, j) : viewPainting(i, j); }
    if (!isEditor) return;
    if (act === 'toggle') { editing = !editing; render(); if (editing && !dirty) say('Click any dashed text to edit it, or a painting to add its photo and details.'); return; }
    if (act === 'add-col') {
      state.collections.push({ id: uid(), title: '', description: '', paintings: [0, 1, 2, 3, 4, 5].map(function () { return { status: 'upcoming' }; }) });
      changed(); editing = true; render();
      var node = document.getElementById('col-' + state.collections[state.collections.length - 1].id);
      if (node) { node.scrollIntoView({ behavior: 'smooth', block: 'start' }); var h = node.querySelector('h2'); if (h) setTimeout(function () { h.focus(); }, 400); }
      return;
    }
    if (act === 'del-col') {
      var ci = +b.getAttribute('data-c');
      if (delArmed !== ci) { delArmed = ci; b.textContent = 'Click again to delete'; clearTimeout(delTimer); delTimer = setTimeout(function () { delArmed = -1; b.textContent = 'Delete collection'; }, 4000); return; }
      delArmed = -1; state.collections.splice(ci, 1); changed(); render(); say('Collection deleted. Use Discard changes to undo.'); return;
    }
    if (act === 'settings') return settingsSheet();
    if (act === 'help') return helpSheet();
    if (act === 'save') return save();
    if (act === 'publish') return publish();
    if (act === 'download-site') { download('index.html', publicDoc('')); say('Downloaded index.html. Upload it to your GitHub repository with Add file, Upload files.'); return; }
    if (act === 'remove-img' && sheetCtx) { state.collections[sheetCtx.c].paintings[sheetCtx.p].image = null; changed(); editPainting(sheetCtx.c, sheetCtx.p); return; }
    if (act === 'remove-intro') { state.hero.image = null; changed(); render(); return; }
    if (act === 'remove-artist') { state.about.photo = null; changed(); render(); return; }
    if (act === 'remove-font') { state.fonts[b.getAttribute('data-which')] = null; changed(); applyFonts(); settingsSheet(); return; }
    if (act === 'discard') { state = normalize(JSON.parse(savedJSON)); dirty = false; clearDraft(); render(); say('Changes discarded.'); return; }
    if (act === 'restore') { var d = readDraft(); if (d) { state = normalize(d.state); editing = true; render(); changed(); say('Edits restored. Press Save to keep them.'); } document.getElementById('eb-restore').hidden = true; return; }
    if (act === 'dismiss-draft') { clearDraft(); document.getElementById('eb-restore').hidden = true; return; }
  });

  /* ---------- start ---------- */
  var y = document.getElementById('year'); if (y) y.textContent = String(new Date().getFullYear());
  render();
  if (isEditor) {
    document.getElementById('editbar').hidden = false;
    var d = readDraft();
    if (d && JSON.stringify(normalize(d.state)) !== savedJSON) document.getElementById('eb-restore').hidden = false;
    say('Your editor. Press Help to set up your free website.');
  } else {
    var bar = document.getElementById('editbar'); if (bar) bar.remove();
  }
})();
</script>
